[tool.ruff]
target-version = "py313"
line-length = 160
indent-width = 2
extend-exclude = [
    ".idea",
    ".venv",
    "**/__pycache__",
    "codex-function-doc-batch/.codex-function-doc-batch",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = true
